<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Chucky Fitness | Entrenamiento personal en Madrid</title>
<meta name="description" content="Entrenamiento personal con rutina a tu medida, vídeo de cada ejercicio y seguimiento de tu progreso.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#15171a;--card:#1e2126;--line:#2e3238;--tx:#eef0f2;--mute:#9aa2ab;--ac:#c8f03c;--err:#ff7a66}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:17px/1.5 Barlow,system-ui,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding-bottom:40px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{font-weight:800;font-size:1.4rem;letter-spacing:-.01em}.logo i{color:var(--ac);font-style:normal}
h1{font-size:2.1rem;line-height:1.1;margin:.3em 0 .6em;font-weight:800}
h2{font-size:1.2rem;margin:1.6em 0 .6em;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
label{display:block;margin:0 0 14px;color:var(--mute);font-size:.95rem}
input{width:100%;margin-top:6px;padding:13px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 18px;background:var(--ac);color:#12140a;width:100%;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
button.ghost{width:auto;background:none;color:var(--mute);border:1px solid var(--line);padding:8px 14px}
button.link{background:none;color:var(--mute);margin-top:6px;text-decoration:underline}
.err{color:var(--err)}.ok{color:var(--ac)}.mute{color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats b{display:block;font-size:2.6rem;line-height:1;color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pill{font-size:.85rem;padding:3px 11px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.pill.active{color:var(--ac);border-color:var(--ac)}
select{width:100%;margin-top:6px;padding:13px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit}
.tabs{display:flex;gap:8px;margin:0 0 8px;overflow-x:auto}
.tab{width:auto;white-space:nowrap;background:none;color:var(--mute);border:1px solid var(--line)}
.tab.on{background:var(--ac);color:#12140a;border-color:var(--ac)}
.two{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin:8px 0}
.exrow{border-top:1px solid var(--line);padding:12px 0}.exrow input{margin-top:0}
.dh{display:block;margin-bottom:6px}.ex-item{padding:8px 0;border-top:1px solid var(--line)}
button.ghost{margin-bottom:12px}
textarea{width:100%;margin-top:6px;padding:13px 14px;min-height:80px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit}
.logbox .exrow b{display:block;margin-bottom:6px}.row span{flex:1}
.hero{padding:12px 0 8px}.hero h1{font-size:2.6rem}.hero button{margin-top:10px}
.btn2{display:block;text-align:center;margin-top:10px;padding:13px 18px;border:1px solid var(--ac);border-radius:10px;color:var(--ac);text-decoration:none;font-weight:600}
.chk{display:flex;gap:10px;align-items:center;color:var(--tx)}.chk input{width:auto;margin:0}
video{width:100%;border-radius:10px;margin-top:8px;background:#000}
.up{margin-top:8px}.up input{margin-top:6px}
html{scroll-behavior:smooth}
.wrap.wide{max-width:1040px}
.tabs{flex-wrap:wrap;overflow:visible}
.hero{padding:28px 0 8px}.hero .kick{color:var(--ac);font-weight:600;margin:0 0 8px}
.hero h1{font-size:clamp(2.4rem,8vw,4.4rem);line-height:1.02;letter-spacing:-.02em;max-width:15ch}
.hero .lead{font-size:1.15rem;max-width:36rem}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn1,.btn2{display:inline-block;width:auto;min-width:210px;text-align:center;margin:0;padding:14px 20px;border-radius:10px;font-weight:600;text-decoration:none}
.btn1{background:var(--ac);color:#12140a}
.facts{display:grid;gap:10px;margin:26px 0}
.sec{padding:36px 0 4px}.sec h2{font-size:clamp(1.6rem,4.5vw,2.3rem);margin:0 0 .4em;font-weight:800;letter-spacing:-.01em}
.grid3{display:grid;gap:12px;margin-top:14px}
.price{font-size:1.7rem;font-weight:800;color:var(--ac);margin:8px 0}
.plan ul{padding-left:18px;margin:8px 0;color:var(--mute)}
.num{color:var(--ac);font-weight:800;font-size:1.7rem}
.about{display:grid;gap:18px}.about img{width:100%;border-radius:14px;object-fit:cover;aspect-ratio:4/5}
details{border-bottom:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:600}
.foot{margin:44px 0 0;padding:20px 0;border-top:1px solid var(--line);color:var(--mute);font-size:.9rem}.foot a{color:var(--mute)}
.hp{position:absolute;left:-9999px;width:1px;height:1px}
@media(min-width:760px){.facts{grid-template-columns:repeat(3,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid3.steps{grid-template-columns:repeat(4,1fr)}.about.ph{grid-template-columns:1fr 1fr;align-items:center}}
@media (prefers-reduced-motion:no-preference){main{animation:in .25s ease-out}}
@keyframes in{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0"></script>
<script>
/* CONFIGURACIÓN: pega aquí la URL del proyecto y la clave PÚBLICA (anon / publishable).

const SUPABASE_URL = 'https://vefelwzrbyatmqgmomjs.supabase.co';

const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS = {active:'Activo', paused:'Pausado', left:'De baja'};
const first = me => (me.full_name || '').trim().split(' ')[0];
let sb = null, recovering = location.hash.includes('type=recovery');

function draw(inner, signedIn, wide) {
  app.innerHTML = `<div class="wrap${wide ? ' wide' : ''}"><header><div class="logo">Chucky<i>Fitness</i></div>${signedIn ? '<button class="ghost" id="out">Salir</button>' : ''}</header><main>${inner}</main></div>`;
  if (signedIn) $('#out').onclick = () => sb.auth.signOut();
}
const note = (id, txt, cls) => { const e = $(id); e.className = cls || ''; e.textContent = txt; };

function viewLogin() {
  draw(`<h1>Entra a tu cuenta</h1>
  <form class="card" id="f">
    <label>Email<input id="em" type="email" autocomplete="email" required></label>
    <label>Contraseña<input id="pw" type="password" autocomplete="current-password" required></label>
    <p id="msg" role="alert"></p>
    <button id="go">Entrar</button>
    <button type="button" class="link" id="forgot">He olvidado mi contraseña</button>
  </form>
  <p class="mute">El acceso es solo por invitación de tu entrenador.</p><button type="button" class="link" id="back">Volver al inicio</button>`);
  $('#f').onsubmit = async e => {
    e.preventDefault(); $('#go').disabled = true; note('#msg', '');
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) { $('#go').disabled = false; note('#msg', 'Email o contraseña incorrectos.', 'err'); }
  };
  $('#back').onclick = viewHome;
  $('#forgot').onclick = async () => {
    const email = $('#em').value.trim();
    if (!email) return note('#msg', 'Escribe tu email y vuelve a pulsar.', 'err');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    error ? note('#msg', 'No se pudo enviar el correo. Inténtalo en unos minutos.', 'err')
          : note('#msg', 'Si el email existe, te llegará un enlace para crear una contraseña nueva.', 'ok');
  };
}

function viewRecover() {
  recovering = true;
  draw(`<h1>Contraseña nueva</h1>
  <form class="card" id="f">
    <label>Escribe una contraseña de al menos 8 caracteres<input id="pw" type="password" autocomplete="new-password" minlength="8" required></label>
    <p id="msg" role="alert"></p>
    <button id="go">Guardar contraseña</button>
  </form>`);
  $('#f').onsubmit = async e => {
    e.preventDefault(); $('#go').disabled = true;
    const { error } = await sb.auth.updateUser({ password: $('#pw').value });
    if (error) { $('#go').disabled = false; return note('#msg', 'No se pudo guardar. Prueba con otra contraseña o pide un enlace nuevo.', 'err'); }
    recovering = false;
    history.replaceState(null, '', location.pathname);
    const { data } = await sb.auth.getSession(); route(data.session);
  };
}

async function route(session) {
  if (!session) return viewHome();
  draw('<p class="mute">Cargando…</p>', true);
  const { data: me, error } = await sb.from('profiles').select('id,role,status,full_name,email').eq('id', session.user.id).single();
  if (recovering) return;
  if (error || !me) return draw('<h1>No se pudo cargar tu perfil</h1><p class="mute">Cierra sesión y vuelve a entrar. Si sigue igual, avisa a tu entrenador.</p>', true);
  me.role === 'trainer' ? viewTrainer(me) : viewStudent(me);
}

const exOpts = ex => ex.map(e => `<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('');
const rowHtml = ex => `<div class="exrow"><select class="ex" aria-label="Ejercicio">${exOpts(ex)}</select><div class="two"><input class="sets" type="number" min="1" max="20" placeholder="Series" aria-label="Series"><input class="reps" placeholder="Repeticiones (ej. 8-10)" aria-label="Repeticiones"></div><input class="note" placeholder="Nota para el alumno (opcional)" aria-label="Nota"></div>`;
const dayHtml = (ex, i) => `<div class="card day"><label>Día ${i}<input class="dname" placeholder="Ej. Lunes, tren inferior"></label><div class="rows">${rowHtml(ex)}</div><button type="button" class="ghost addex">Añadir ejercicio</button></div>`;

/* ============ CONTENIDO DE LA PORTADA (edítalo aquí) ============
   Todo lo que ves en la web pública sale de este bloque.
   Los textos son provisionales: Chucky debe revisarlos y confirmar sus servicios y precios. */
const SITE = {
  kicker: 'Entrenamiento personal en Madrid',
  title: 'Entrena con un plan hecho solo para ti',
  lead: 'Diseño tu rutina según tu punto de partida, tus objetivos y el tiempo que tienes de verdad. La llevas en el móvil, con vídeo de cada ejercicio, y la ajustamos con lo que vas registrando.',
  cta: 'Quiero entrenar con Chucky',
  photo: '', // Foto de Chucky: sube el fichero al repositorio y pon aquí su nombre, por ejemplo 'chucky.jpg'
  facts: ['Plan individual, uno a uno', 'Vídeo de cada ejercicio', 'Tu progreso siempre a la vista'],
  services: [
    { name: 'Online', desc: 'Tu rutina en el móvil, con seguimiento y revisión de tus sesiones.', price: 'Consultar', items: ['Rutina personalizada', 'Vídeo de cada ejercicio', 'Registro de series y pesos', 'Tu entrenador revisa tus sesiones'] },
    { name: 'Presencial', desc: 'Entrenamiento acompañado en sala, con corrección de técnica en directo.', price: 'Consultar', items: ['Sesiones dirigidas', 'Corrección de técnica en directo', 'Todo lo del plan online'] },
    { name: 'Readaptación', desc: 'Para volver a entrenar después de una lesión, con una progresión a tu medida.', price: 'A medida', items: ['Valoración inicial', 'Progresión adaptada a ti', 'Seguimiento cercano'] }
  ],
  aboutTitle: 'Sobre mí',
  about: 'Soy Chucky, entrenador personal. Trabajo uno a uno con cada persona: antes de proponerte nada quiero saber de dónde vienes, qué objetivos tienes y cuánto tiempo puedes dedicarle de verdad.',

    ['¿Quién ve mis datos?', 'Solo tú y tu entrenador. Cada persona accede únicamente a lo suyo.']
  ]
};

async function viewHome() {
  const { data } = await sb.from('testimonials').select('author_name,body').order('created_at', { ascending: false }).limit(6);
  const S = SITE, T = data || [];
  draw(`<section class="hero"><p class="kick">${esc(S.kicker)}</p><h1>${esc(S.title)}</h1><p class="lead mute">${esc(S.lead)}</p><div class="cta"><a class="btn1" href="#contacto">${esc(S.cta)}</a><a class="btn2" href="#servicios">Ver servicios</a></div></section>
  <div class="facts">${S.facts.map(f => `<div class="card">${esc(f)}</div>`).join('')}</div>
  <section class="sec" id="servicios"><h2>Cómo puedo ayudarte</h2><p class="mute">Todos los planes incluyen rutina personalizada, vídeos de cada ejercicio y seguimiento de tu progreso.</p><div class="grid3">${S.services.map(s => `<div class="card plan"><b class="dh">${esc(s.name)}</b><p class="mute">${esc(s.desc)}</p><div class="price">${esc(s.price)}</div><ul>${s.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div></section>
  <section class="sec"><div class="about${S.photo ? ' ph' : ''}">${S.photo ? `<img src="${esc(S.photo)}" alt="Chucky, entrenador personal" loading="lazy">` : ''}<div><h2>${esc(S.aboutTitle)}</h2><p>${esc(S.about)}</p></div></div></section>
  <section class="sec"><h2>Cómo funciona</h2><div class="grid3 steps">${S.steps.map((s, i) => `<div class="card"><div class="num">${i + 1}</div><b class="dh">${esc(s[0])}</b><span class="mute">${esc(s[1])}</span></div>`).join('')}</div></section>
  ${T.length ? `<section class="sec"><h2>Lo que dicen quienes entrenan conmigo</h2><div class="grid3">${T.map(t => `<div class="card"><p>«${esc(t.body)}»</p><b>${esc(t.author_name)}</b></div>`).join('')}</div></section>` : ''}
  <section class="sec"><h2>Preguntas frecuentes</h2>${S.faq.map(f => `<details><summary>${esc(f[0])}</summary><p class="mute">${esc(f[1])}</p></details>`).join('')}</section>
  <section class="sec" id="contacto"><h2>Cuéntame de dónde vienes</h2><p class="mute">Leo cada solicitud y respondo yo personalmente.</p>
  <form class="card" id="lf"><label>Nombre<input id="ln" required maxlength="100" autocomplete="name"></label><label>Email<input id="le" type="email" required maxlength="150" autocomplete="email"></label><label>Teléfono (opcional)<input id="lp" type="tel" maxlength="30" autocomplete="tel"></label><label>Qué te interesa<select id="li">${S.services.map(s => `<option>${esc(s.name)}</option>`).join('')}<option>Todavía no lo sé</option></select></label><label>Cuéntame tu situación<textarea id="lm" maxlength="1000"></textarea></label><input class="hp" id="lw" tabindex="-1" autocomplete="off" aria-hidden="true"><label class="chk"><input type="checkbox" id="lc" required> Acepto que se traten mis datos para responder a esta solicitud.</label><p class="mute">Responsable: Chucky, entrenador personal. Solo usaré tus datos para contestarte y puedes pedirme que los borre.</p><p id="lmsg" role="alert"></p><button id="lgo">Enviar solicitud</button></form></section>
  <div class="foot">Chucky, entrenamiento personal en Madrid. <a href="#" id="flogin">Acceso de alumnos</a></div>`, false, true);
  document.querySelector('header').insertAdjacentHTML('beforeend', '<button class="ghost" id="hlogin">Acceder</button>');
  $('#hlogin').onclick = viewLogin; $('#flogin').onclick = e => { e.preventDefault(); viewLogin(); };
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    if ($('#lw').value) return;
    $('#lgo').disabled = true; note('#lmsg', '');
    const { error } = await sb.from('leads').insert({ name: $('#ln').value.trim(), email: $('#le').value.trim(), phone: $('#lp').value.trim() || null, interest: $('#li').value, message: $('#lm').value.trim() || null, consent: $('#lc').checked });
    if (error) { $('#lgo').disabled = false; return note('#lmsg', /Demasiadas/.test(error.message) ? 'Hay muchas solicitudes ahora mismo. Inténtalo en un rato.' : 'No se pudo enviar. Revisa los datos e inténtalo de nuevo.', 'err'); }
    $('#lf').innerHTML = '<b class="dh">Solicitud enviada</b><p class="mute">Gracias. Te responderé lo antes posible.</p>';
  };
}

function bindVideos() {
  document.querySelectorAll('.vid').forEach(b => b.onclick = async () => {
    const box = b.nextElementSibling; b.disabled = true;
    const { data, error } = await sb.storage.from('exercise-videos').createSignedUrl(b.dataset.p, 3600);
    b.disabled = false;
    if (error || !data) return box.textContent = 'No se pudo cargar el vídeo.';
    box.innerHTML = `<video controls playsinline preload="metadata" src="${esc(data.signedUrl)}"></video>`;
    b.hidden = true;
  });
}

async function viewTrainer(me, tab = 'alumnos') {
  const [a, b, vd, tm, ld] = await Promise.all([
    sb.from('profiles').select('id,full_name,email,status').eq('role', 'student').order('created_at', { ascending: false }),
    sb.from('exercises').select('id,name,muscle_groups,description').eq('archived', false).order('name'),
    sb.from('videos').select('exercise_id,provider_asset_id').eq('status', 'ready').order('created_at'),
    sb.from('testimonials').select('*').order('created_at', { ascending: false }),
    sb.from('leads').select('*').order('created_at', { ascending: false })]);
  const vm = {}; (vd.data || []).forEach(v => vm[v.exercise_id] = v.provider_asset_id);
  const tms = tm.data || [];
  const lds = ld.data || [], nl = lds.filter(x => !x.handled).length;
  if (a.error || b.error) return draw('<h1>No se pudieron cargar los datos</h1><p class="err">' + esc((a.error || b.error).message) + '</p>', true);
  const st = a.data, ex = b.data, n = s => st.filter(x => x.status === s).length;
  const nav = `<nav class="tabs">${[['alumnos', 'Alumnos'], ['ejercicios', 'Ejercicios'], ['rutina', 'Nueva rutina'], ['sesiones', 'Sesiones'], ['resenas', 'Reseñas'], ['solicitudes', 'Solicitudes' + (nl ? ` (${nl})` : '')]].map(([k, l]) => `<button class="tab ${k === tab ? 'on' : ''}" data-t="${k}">${l}</button>`).join('')}</nav>`;
  let body = '';
  if (tab === 'alumnos') body = `<div class="stats"><div class="card"><b>${n('active')}</b>alumnos activos</div><div class="card"><b>${n('paused')}</b>pausados</div></div><h2>Tus alumnos</h2>` +
    (st.length ? st.map(s => `<div class="card row"><div>${esc(s.full_name || s.email)}<div class="mute">${esc(s.email)}</div></div><span class="pill ${esc(s.status)}">${esc(STATUS[s.status])}</span></div>`).join('')
      : '<div class="card mute">Todavía no tienes alumnos. Cuando invites al primero, aparecerá aquí.</div>');
  if (tab === 'ejercicios') body = `<h2>Nuevo ejercicio</h2><form class="card" id="fx"><label>Nombre<input id="xn" required maxlength="80"></label><label>Grupo muscular<input id="xg" placeholder="Ej. piernas" maxlength="40"></label><label>Cómo se hace<input id="xd" maxlength="300"></label><p id="msg" role="alert"></p><button id="go">Guardar ejercicio</button></form><h2>Catálogo (${ex.length})</h2>` +
    (ex.length ? ex.map(e => `<div class="card">${esc(e.name)}<div class="mute">${esc((e.muscle_groups || []).join(', '))}${e.description ? ' · ' + esc(e.description) : ''}</div>${vm[e.id] ? `<button class="ghost vid" data-p="${esc(vm[e.id])}">Ver vídeo</button><div class="vbox"></div>` : ''}<label class="up">${vm[e.id] ? 'Cambiar vídeo' : 'Subir vídeo (MP4, WebM o MOV, máx. 50 MB)'}<input type="file" class="vf" data-e="${esc(e.id)}" accept="video/mp4,video/webm,video/quicktime"></label><p class="mute vst"></p></div>`).join('') : '<div class="card mute">El catálogo está vacío. Crea tu primer ejercicio arriba.</div>');
  if (tab === 'rutina') body = !st.length ? '<div class="card mute">Necesitas al menos un alumno para crear una rutina.</div>'
    : !ex.length ? '<div class="card mute">Crea primero algún ejercicio en la pestaña Ejercicios.</div>'
    : `<h2>Nueva rutina</h2><form id="fr"><div class="card"><label>Alumno<select id="rs">${st.map(s => `<option value="${esc(s.id)}">${esc(s.full_name || s.email)}</option>`).join('')}</select></label><label>Nombre de la rutina<input id="rn" required maxlength="80" placeholder="Ej. Bloque de fuerza"></label></div><div id="days">${dayHtml(ex, 1)}</div><button type="button" class="ghost" id="addday">Añadir día</button><p id="msg" role="alert"></p><button id="go">Publicar rutina</button></form>`;
  if (tab === 'sesiones') body = await sessionsHtml();
  if (tab === 'solicitudes') body = '<h2>Solicitudes de nuevos clientes</h2>' + (lds.length ? lds.map(l => `<div class="card"><b class="dh">${esc(l.name)}</b><div class="mute">${fmtDate(l.created_at)}${l.interest ? ', ' + esc(l.interest) : ''}</div><p><a href="mailto:${esc(l.email)}">${esc(l.email)}</a>${l.phone ? ` / <a href="tel:${esc(l.phone.replace(/[^\d+]/g, ''))}">${esc(l.phone)}</a>` : ''}</p>${l.message ? `<p>${esc(l.message)}</p>` : ''}<div class="row"><span class="pill ${l.handled ? 'active' : ''}">${l.handled ? 'Atendida' : 'Nueva'}</span><button class="ghost lh" data-id="${esc(l.id)}" data-h="${l.handled}">${l.handled ? 'Marcar como nueva' : 'Marcar atendida'}</button><button class="ghost ld" data-id="${esc(l.id)}">Borrar</button></div></div>`).join('') : '<div class="card mute">Todavía no hay solicitudes. Las que lleguen desde la portada aparecerán aquí.</div>');
  if (tab === 'resenas') body = `<h2>Nueva reseña</h2><form class="card" id="ft"><label>Nombre del cliente<input id="tn" required maxlength="60" placeholder="Ej. Laura M."></label><label>Su opinión<textarea id="tb" required minlength="10" maxlength="600"></textarea></label><label class="chk"><input type="checkbox" id="tc"> El cliente me ha dado permiso para publicarla</label><p id="msg" role="alert"></p><button id="go">Guardar reseña</button></form><h2>Reseñas (${tms.length})</h2>` + (tms.length ? tms.map(t => `<div class="card"><b>${esc(t.author_name)}</b><p>${esc(t.body)}</p><div class="row"><span class="pill ${t.published ? 'active' : ''}">${t.published ? 'Publicada' : 'Oculta'}</span><button class="ghost tg" data-id="${esc(t.id)}" data-p="${t.published}">${t.published ? 'Ocultar' : 'Publicar'}</button><button class="ghost dl" data-id="${esc(t.id)}">Borrar</button></div></div>`).join('') : '<div class="card mute">Aún no hay reseñas. Añade la primera con permiso del cliente.</div>');
  draw(`<h1>Hola${first(me) ? ', ' + esc(first(me)) : ''}</h1>${nav}${body}`, true);
  if (tab === 'ejercicios') {
    bindVideos();
    document.querySelectorAll('.vf').forEach(i => i.onchange = async () => {
      const f = i.files[0]; if (!f) return; const st = i.closest('.card').querySelector('.vst');
      if (!['video/mp4', 'video/webm', 'video/quicktime'].includes(f.type)) return st.textContent = 'Formato no válido. Usa MP4, WebM o MOV.';
      if (f.size > 50 * 1024 * 1024) return st.textContent = 'El vídeo pesa más de 50 MB. Grábalo más corto o comprímelo.';
      st.textContent = 'Subiendo…'; i.disabled = true;
      const path = `${i.dataset.e}/${crypto.randomUUID()}.${f.type === 'video/webm' ? 'webm' : f.type === 'video/quicktime' ? 'mov' : 'mp4'}`;
      const up = await sb.storage.from('exercise-videos').upload(path, f, { contentType: f.type });
      if (up.error) { i.disabled = false; return st.textContent = 'No se pudo subir el vídeo.'; }
      const ins = await sb.from('videos').insert({ exercise_id: i.dataset.e, provider: 'supabase', provider_asset_id: path, status: 'ready', size_bytes: f.size });
      if (ins.error) { await sb.storage.from('exercise-videos').remove([path]); i.disabled = false; return st.textContent = 'No se pudo registrar el vídeo.'; }
      viewTrainer(me, 'ejercicios');
    });
  }
  if (tab === 'solicitudes') {
    document.querySelectorAll('.lh').forEach(b => b.onclick = async () => { await sb.from('leads').update({ handled: b.dataset.h !== 'true' }).eq('id', b.dataset.id); viewTrainer(me, 'solicitudes'); });
    document.querySelectorAll('.ld').forEach(b => b.onclick = async () => { if (!confirm('¿Borrar esta solicitud?')) return; await sb.from('leads').delete().eq('id', b.dataset.id); viewTrainer(me, 'solicitudes'); });
  }
  if (tab === 'resenas') {
    $('#ft').onsubmit = async e => {
      e.preventDefault(); $('#go').disabled = true;
      const c = $('#tc').checked;
      const { error } = await sb.from('testimonials').insert({ author_name: $('#tn').value.trim(), body: $('#tb').value.trim(), consent_confirmed: c, published: c });
      if (error) { $('#go').disabled = false; return note('#msg', 'No se pudo guardar la reseña.', 'err'); }
      viewTrainer(me, 'resenas');
    };
    document.querySelectorAll('.tg').forEach(b => b.onclick = async () => {
      const { error } = await sb.from('testimonials').update({ published: b.dataset.p !== 'true' }).eq('id', b.dataset.id);
      if (error) return alert('No se puede publicar una reseña sin permiso del cliente.');
      viewTrainer(me, 'resenas');
    });
    document.querySelectorAll('.dl').forEach(b => b.onclick = async () => {
      if (!confirm('¿Borrar esta reseña?')) return;
      await sb.from('testimonials').delete().eq('id', b.dataset.id); viewTrainer(me, 'resenas');
    });
  }
  if (tab === 'sesiones') bindReviews();
  document.querySelectorAll('.tab').forEach(x => x.onclick = () => viewTrainer(me, x.dataset.t));
  if (tab === 'ejercicios') $('#fx').onsubmit = async e => {
    e.preventDefault(); $('#go').disabled = true;
    const g = $('#xg').value.trim();
    const { error } = await sb.from('exercises').insert({ name: $('#xn').value.trim(), muscle_groups: g ? [g] : [], description: $('#xd').value.trim() || null });
    if (error) { $('#go').disabled = false; return note('#msg', error.code === '23505' ? 'Ya existe un ejercicio con ese nombre.' : 'No se pudo guardar el ejercicio.', 'err'); }
    viewTrainer(me, 'ejercicios');
  };
  if (tab === 'rutina' && st.length && ex.length) {
    const f = $('#fr');
    $('#addday').onclick = () => $('#days').insertAdjacentHTML('beforeend', dayHtml(ex, $('#days').children.length + 1));
    f.onclick = e => { if (e.target.classList.contains('addex')) e.target.previousElementSibling.insertAdjacentHTML('beforeend', rowHtml(ex)); };
    f.onsubmit = async e => {
      e.preventDefault();
      const days = [...f.querySelectorAll('.day')].map(d => ({ name: d.querySelector('.dname').value.trim(), exercises: [...d.querySelectorAll('.exrow')].map(r => ({ exercise_id: r.querySelector('.ex').value, sets: r.querySelector('.sets').value, reps: r.querySelector('.reps').value.trim(), note: r.querySelector('.note').value.trim() })) }));
      if (days.some(d => !d.name)) return note('#msg', 'Ponle nombre a todos los días.', 'err');
      $('#go').disabled = true; note('#msg', '');
      const { error } = await sb.rpc('publish_routine', { p_student: $('#rs').value, p_name: $('#rn').value, p_days: days });
      if (error) { $('#go').disabled = false; return note('#msg', 'No se pudo publicar la rutina: ' + error.message, 'err'); }
      viewTrainer(me, 'alumnos');
    };
  }
}

const fmtDate = d => new Date(d).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
function setsHtml(l) {
  const g = {};
  (l || []).slice().sort((a, b) => a.set_number - b.set_number).forEach(x => (g[x.exercise_name] ||= []).push(`${x.reps ?? '-'}×${x.weight_kg ?? '-'} kg`));
  return Object.entries(g).map(([k, v]) => `<div class="ex-item">${esc(k)}<div class="mute">${esc(v.join(', '))}</div></div>`).join('');
}

async function sessionsHtml() {
  const { data, error } = await sb.from('workout_sessions').select('id,name,completed_at,rpe,student_comment,trainer_review,profiles(full_name,email),set_logs(exercise_name,set_number,reps,weight_kg)').eq('status', 'completed').order('completed_at', { ascending: false }).limit(20);
  if (error) return '<div class="card err">No se pudieron cargar las sesiones.</div>';
  if (!data.length) return '<h2>Sesiones de tus alumnos</h2><div class="card mute">Cuando un alumno termine una sesión, aparecerá aquí para que la revises.</div>';
  return '<h2>Sesiones de tus alumnos</h2>' + data.map(s => `<div class="card"><b class="dh">${esc(s.profiles?.full_name || s.profiles?.email)}: ${esc(s.name)}</b><div class="mute">${fmtDate(s.completed_at)}${s.rpe ? ', esfuerzo ' + s.rpe + '/10' : ''}</div>${setsHtml(s.set_logs)}${s.student_comment ? `<p>«${esc(s.student_comment)}»</p>` : ''}<label>Tu revisión<textarea data-id="${esc(s.id)}" maxlength="1000">${esc(s.trainer_review || '')}</textarea></label><button class="rev" data-id="${esc(s.id)}">Guardar revisión</button><p class="mute" id="r-${esc(s.id)}"></p></div>`).join('');
}

function bindReviews() {
  document.querySelectorAll('.rev').forEach(b => b.onclick = async () => {
    const id = b.dataset.id, t = document.querySelector(`textarea[data-id="${id}"]`).value.trim();
    b.disabled = true;
    const { error } = await sb.from('workout_sessions').update({ trainer_review: t || null, reviewed_at: new Date().toISOString() }).eq('id', id);
    b.disabled = false; note('#r-' + id, error ? 'No se pudo guardar.' : 'Revisión guardada.', error ? 'err' : 'ok');
  });
}

async function viewStudent(me) {
  const [r, h, vv] = await Promise.all([
    sb.from('routines').select('id,name,routine_versions(version,published_at,routine_days(id,position,name,routine_exercises(exercise_id,position,sets,reps,trainer_note,exercises(name))))').order('created_at', { ascending: false }),
    sb.from('workout_sessions').select('id,name,completed_at,rpe,trainer_review,set_logs(exercise_name,set_number,reps,weight_kg)').eq('status', 'completed').order('completed_at', { ascending: false }).limit(10),
    sb.from('videos').select('exercise_id,provider_asset_id').eq('status', 'ready').order('created_at')]);
  const vmap = {}; (vv.data || []).forEach(v => vmap[v.exercise_id] = v.provider_asset_id);
  const by = k => (a, b) => a[k] - b[k], days = {};
  const show = x => {
    const v = (x.routine_versions || []).filter(y => y.published_at).sort((a, b) => b.version - a.version)[0];
    if (!v) return '';
    return `<h2>${esc(x.name)}</h2>` + (v.routine_days || []).sort(by('position')).map(d => {
      const exs = (d.routine_exercises || []).sort(by('position')); days[d.id] = exs;
      return `<div class="card" id="d-${esc(d.id)}"><b class="dh">${esc(d.name)}</b>${exs.map(e => `<div class="ex-item">${esc(e.exercises.name)}<span class="mute"> ${e.sets ? e.sets + ' series' : ''}${e.reps ? ' de ' + esc(e.reps) : ''}</span>${e.trainer_note ? `<div class="mute">${esc(e.trainer_note)}</div>` : ''}${vmap[e.exercise_id] ? `<button class="ghost vid" data-p="${esc(vmap[e.exercise_id])}">Ver vídeo</button><div class="vbox"></div>` : ''}</div>`).join('')}<button class="ghost startlog" data-d="${esc(d.id)}">Registrar sesión</button><div class="logbox"></div></div>`;
    }).join('');
  };
  const hist = h.data || [], best = {};
  hist.forEach(s => (s.set_logs || []).forEach(l => { if (l.weight_kg != null && l.reps > 0 && (!best[l.exercise_name] || l.weight_kg > best[l.exercise_name])) best[l.exercise_name] = l.weight_kg; }));
  const vol = s => Math.round((s.set_logs || []).reduce((t, l) => t + (l.reps || 0) * (l.weight_kg || 0), 0));
  const html = r.error ? '<div class="card err">No se pudo cargar tu rutina. Inténtalo de nuevo en unos minutos.</div>' : (r.data.map(show).join('') || '<div class="card mute">Tu entrenador aún no te ha asignado ninguna rutina. Cuando lo haga, la verás aquí.</div>');
  const prs = Object.keys(best).length ? `<h2>Tus mejores marcas</h2><div class="card">${Object.entries(best).map(([k, v]) => `<div class="row"><span>${esc(k)}</span><b>${v} kg</b></div>`).join('')}<p class="mute">Calculado con los pesos que has anotado tú.</p></div>` : '';
  const past = hist.length ? `<h2>Tus últimas sesiones</h2>` + hist.map(s => `<div class="card"><b class="dh">${esc(s.name)}</b><div class="mute">${fmtDate(s.completed_at)}, ${vol(s)} kg de volumen${s.rpe ? ', esfuerzo ' + s.rpe + '/10' : ''}</div>${s.trainer_review ? `<p><b>Comentario de tu entrenador:</b> ${esc(s.trainer_review)}</p>` : ''}</div>`).join('') : '';
  draw(`<h1>Hola${first(me) ? ', ' + esc(first(me)) : ''}</h1>${html}${prs}${past}`, true);
  bindVideos();
  document.querySelectorAll('.startlog').forEach(b => b.onclick = () => {
    const d = b.dataset.d, box = b.nextElementSibling; b.hidden = true;
    box.innerHTML = `<form>${days[d].map(e => `<div class="exrow" data-e="${esc(e.exercise_id)}"><b>${esc(e.exercises.name)}</b>${Array.from({ length: e.sets || 3 }, (_, i) => `<div class="two"><input class="rp" type="number" min="0" max="1000" inputmode="numeric" placeholder="Reps" aria-label="Repeticiones serie ${i + 1}"><input class="kg" type="number" min="0" max="1000" step="0.5" inputmode="decimal" placeholder="Kg" aria-label="Peso serie ${i + 1}"></div>`).join('')}</div>`).join('')}<label>Esfuerzo de 1 a 10<input class="rpe" type="number" min="1" max="10" inputmode="numeric"></label><label>Cómo te has sentido<textarea class="cm" maxlength="1000"></textarea></label><p class="lmsg" role="alert"></p><button class="save">Guardar sesión</button></form>`;
    const f = box.firstElementChild, msg = f.querySelector('.lmsg');
    f.onsubmit = async ev => {
      ev.preventDefault();
      const cnt = {}, sets = [];
      f.querySelectorAll('.exrow').forEach(row => row.querySelectorAll('.two').forEach(p => {
        const rp = p.querySelector('.rp').value, kg = p.querySelector('.kg').value;
        if (rp === '' && kg === '') return;
        const id = row.dataset.e; cnt[id] = (cnt[id] || 0) + 1;
        sets.push({ exercise_id: id, set_number: cnt[id], reps: rp, weight_kg: kg });
      }));
      if (!sets.length) { msg.className = 'lmsg err'; return msg.textContent = 'Anota al menos una serie.'; }
      f.querySelector('.save').disabled = true;
      const { error } = await sb.rpc('log_session', { p_day: d, p_rpe: f.querySelector('.rpe').value ? +f.querySelector('.rpe').value : null, p_comment: f.querySelector('.cm').value, p_sets: sets });
      if (error) { f.querySelector('.save').disabled = false; msg.className = 'lmsg err'; return msg.textContent = 'No se pudo guardar. Revisa los números e inténtalo de nuevo.'; }
      viewStudent(me);
    };
  });
}

if (SUPABASE_URL.startsWith('PEGA')) {
  document.body.innerHTML = '<p style="padding:24px">Falta configurar SUPABASE_URL y SUPABASE_KEY al principio del script.</p>';
} else {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((ev, session) => {
    // setTimeout evita bloqueos al llamar a Supabase dentro de este callback
    if (ev === 'PASSWORD_RECOVERY') { recovering = true; return setTimeout(viewRecover, 0); }
    if (recovering) return;
    if (['INITIAL_SESSION', 'SIGNED_IN', 'SIGNED_OUT'].includes(ev)) setTimeout(() => route(session), 0);
  });
}
</script>
</body>
</html>
